[modem]
type = "quectel"
port = "/dev/ttyUSB2"
baud_rate = 115200
timeout = 1.0
# "servingcell" (Standard, AT+QENG) or "sa_scan" (AT+QSCAN, NR5G-SA-only).
# For "sa_scan", band/modus have to be set manually via AT console before running:
#   AT+QNWPREFCFG="mode_pref",NR5GSA
#   AT+QNWPREFCFG="nr5g_disable",0
#   AT+QNWPREFCFG="nsa_disable",1
#   AT+QNWPREFCFG="lte_disable",1
mode = "serving_cell"

[gnss_receiver]
type = "nmea_serial"
port = "/dev/serial0"
baud_rate = 9600
timeout = 1.0

[collector]
position_threshold = 15
max_idle_time = 200
max_wait_for_first_fix = 300
wait_log_interval = 5
keep_alive_host = "8.8.8.8"
keep_alive_port = 53
keep_alive_interval_s = 4.0
gps_enabled = true
gps_disabled_poll_interval_s = 5.0

# Periodic run-status report to the backend server. Must be an https URL - see
# docs/decisions/0007-remote-access-design.md.
[heartbeat]
enabled = false
url = "https://add.your.backend.here/heartbeat"
interval_s = 60.0
timeout_s = 10.0

# Quality cutoffs a measurement must clear on every metric to be counted as "good"
# in the run status. Configured per RAT; see docs/decisions/0002-heartbeat-quality-thresholds.md.
[run_status]
empty_captures_until_pipeline_broken = 3

[run_status.lte]
min_rsrp = -100.0
min_rsrq = -11.0
min_sinr = 0.0

[run_status.nr]
min_rsrp = -100.0
min_rsrq = -11.0
min_sinr = 0.0

[uploader]
upload_dir = "/home/admin/Logger/upload_queue"
upload_user = "tim"
upload_host = "141.82.3.41"
upload_port = 2000
remote_dir = "/home/tim/5g-measurement-software/uploads/"
debug_upload = true

[logging]
level = "INFO"
log_file = "5g-measurement.log"
max_bytes = 5_000_000
backup_count = 3

[system]
running_on_pi = false
shutdown_gpio = 17
network_interfaces = ["wlan0", "wwan0"]