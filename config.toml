[modem]
type = "quectel"
# port is left unset: the modem's AT interface is then found by its stable
# /dev/serial/by-id/usb-Quectel_*-if02-port0 name on every open, so it's still found after the
# modem re-enumerates on USB (where /dev/ttyUSBn numbering can shift). Set it only to pin a port.
# port = "/dev/ttyUSB2"
baud_rate = 115200
timeout = 1.0
# "serving_cell" (standard, AT+QENG) or "sa_scan" (AT+QSCAN, NR5G-SA-only).
# For "sa_scan", band/modus have to be set manually via AT console before running:
#   AT+QNWPREFCFG="mode_pref",NR5GSA
#   AT+QNWPREFCFG="nr5g_disable",0
#   AT+QNWPREFCFG="nsa_disable",1
#   AT+QNWPREFCFG="lte_disable",1
mode = "serving_cell"

[gnss_receiver]
type = "nmea_serial"
port = "/dev/serial0"
baud_rate = 9600
timeout = 1.0

# device_id is omitted here - it defaults to this Pi's hostname, which is already distinct
# per device in a fleet. Set it explicitly only to override that.
[device]
mission_type = "ground"

[collector]
position_threshold = 15
max_idle_time = 1800
max_wait_for_first_fix = 300
wait_log_interval = 5
keep_alive_host = "8.8.8.8"
keep_alive_port = 53
keep_alive_interval_s = 4.0
gps_enabled = true
gps_disabled_poll_interval_s = 5.0
capture_gate = "distance"
capture_interval_s = 15.0
# If the modem connection is lost mid-run (e.g. it dropped off USB), the capture is skipped and the
# modem reopened up to this many times, this many seconds apart, before the error ends the run.
modem_reconnect_attempts = 10
modem_reconnect_delay_s = 3.0

# Pre-flight wait for confirmed vehicle movement, before Collector.collect() starts. Runs
# GNSS-only, at a low duty cycle. In Auto Mode the modem/quectel-CM are already open for the
# heartbeat by the time this wait starts.
[movement_gate]
enabled = true
poll_interval_s = 45.0
movement_threshold = 10.0
confirmations_required = 2
# Optional known garage/home position - unset (the default) falls back to pure movement-distance
# detection. Set both to additionally require departure from this position before starting a run.
# home_latitude = 0.0
# home_longitude = 0.0
home_departure_threshold = 100.0

# quectel-CM connection-manager daemon, started by this app itself (via sudo) right at boot, in
# both modes - not auto-started by systemd.
# binary is this device's local install path - set it in config.local.toml, not here (see
# https://bosdra.net.tha.de/docs/en/). The placeholder below is intentionally never a real path.
[quectel_cm]
binary = "/add/your/quectel-CM/path/here"
args = ["-s", "web.vodafone.de"]

# Shared destination for everything this device sends to the backend server (heartbeat and
# measurement uploads alike). url must be https, since the backend's answers are a path for
# instructions to reach the device.
# url and device_key are per-device identity/secrets - set them in config.local.toml, not here
# (see https://bosdra.net.tha.de/docs/en/). The placeholders below are intentionally never real values.
[backend]
url = "https://add.your.backend.here"
# Per-device API key for authenticating requests with the backend.
device_key = ""

# Periodic report to the backend on how the current run is going. Its response can carry
# allow-listed config overrides and one-shot remote commands - hmac_secret verifies those
# responses came from the real backend. Leave it unset to keep remote commands disabled (any
# response claiming to carry them is discarded and logged).
# device_id and hmac_secret are per-device identity/secrets - set them in config.local.toml, not
# here (see https://bosdra.net.tha.de/docs/en/).
[heartbeat]
enabled = true
path = "/api/heartbeat"
interval_s = 15.0
timeout_s = 10.0
# Delivered heartbeats are logged at INFO: the first, the first after failures, and otherwise one
# summary line per this many seconds.
success_log_interval_s = 600.0
# Device identifier for the backend to distinguish devices. Unset here on purpose: it has to be
# the id the backend provisioned, and [device] device_id must be set to the same value.
device_id = ""
hmac_secret = ""

# Where `python -m measurement_software.selftest` reports check results (pass/fail/skip per
# hardware-facing subsystem), for the manual field checks. Reuses heartbeat.device_id and
# backend.device_key above for authentication - no separate credential.
# Empty by default: an unconfigured device runs selftest checks locally (console output) only.
# results_url is per-device identity (embeds the real backend host) - set it in
# config.local.toml, not here (see https://bosdra.net.tha.de/docs/en/).
[selftest]
results_url = ""

# Live GPS-fix-finding diagnostic (run-gps-fix-test-now / stop-gps-fix-test-now), for finding a
# good antenna mounting position - only dispatched while in Manual Mode. Posts num_satellites/has_fix/elapsed_s to
# status_url roughly every report_interval_s while the run is going; auto-stops after timeout_s
# if stop-gps-fix-test-now never arrives. Reuses heartbeat.device_id/backend.device_key for
# authentication - no separate credential. status_url is per-device identity (embeds the real
# backend host) - set it in config.local.toml, not here (see https://bosdra.net.tha.de/docs/en/).
[gps_fix_test]
status_url = ""
report_interval_s = 2.0
timeout_s = 300.0

# What the heartbeat reports about the run. A measurement counts as "valid" if RSRP, RSRQ and
# SINR are all within what the radio standard allows to be reported, and "invalid" otherwise.
# Judging how good a valid signal is happens in analysis of the recorded data, not here.
[run_status]
# How many consecutive captures may come back empty while the device is moving before the
# heartbeat reports the measurement pipeline as broken.
empty_captures_until_pipeline_broken = 3

# Local upload-backlog safety net. Not a cap or eviction policy - just a loud warning if free
# space on the upload_dir's filesystem drops below this margin, in case a connectivity gap runs
# much longer than expected.
[storage]
low_free_space_warning_bytes = 500_000_000

# Small SSD1306 OLED status display over I2C, for field diagnostics with no terminal attached.
# Set enabled = false on a device with no screen attached: a no-op display is then used instead.
[display]
enabled = true
type = "ssd1306"
i2c_port = 1
i2c_address = 0x3C
refresh_interval_s = 2.0

# Active latency measurements via flent, run against a test server while the vehicle is moving.
# Inert until host is set: flent needs a counterpart running on the server (netperf for the load
# test, a reachable host for the baseline ping), and the load test deliberately saturates the
# link, so only set host once that server side is confirmed.
# Requires flent and numpy on the device. host is per-device identity (the real test server
# hostname) - set it in config.local.toml, not here (see https://bosdra.net.tha.de/docs/en/).
[latency_test]
enabled = true
host = ""
flent_binary = "flent"
# Cheap ping-only run, for the latency of an otherwise idle link.
baseline_test = "ping"
baseline_interval_s = 60.0
baseline_length_s = 10
# Latency under load: saturates the link for its whole length, hence the far sparser cadence.
load_test = "rrul"
load_interval_s = 900.0
load_length_s = 60
# How often the tester wakes to see whether either test has come due.
poll_interval_s = 30.0
# How recently the vehicle must have moved for a due test to actually run. The collection loop
# reports movement in discrete events - one each time the vehicle clears [collector]
# position_threshold - so whether it is moving right now is answered by how long ago the last of
# those was. A due test whose vehicle has been still for longer than this waits for the next
# tick instead. At the 15 m default threshold, 30 s treats anything slower than roughly walking
# pace as stopped: raise it to keep testing through slow traffic, lower it to stop testing
# sooner after the vehicle parks.
movement_window_s = 30.0
timeout_s = 300.0

# Uploads go over HTTPS POST to [backend] url's scheme and host, with this section's own path
# swapped in for [backend]'s - there is no separate upload host/port to configure. `path` and
# `latency_path` are separate endpoints: they carry incompatible schemas (see UploaderConfig).
# Confirmed live against the real backend: unlike `path`, which takes one POST per *file* (a
# whole batch array), `latency_path` only accepts one POST per *record* (a bare JSON object) -
# it 422s a posted array outright. Uploader.upload_pending_files() already accounts for this
# (see Uploader._upload_latency_file); this is just a heads-up in case that endpoint's contract
# ever changes on the backend side.
[uploader]
# Placeholder, relative to the working directory. Set the real, absolute path per device in
# config.local.toml ([uploader] upload_dir) - it is deliberately not kept here.
upload_dir = "upload_queue"
path = "/api/measurements"
latency_path = "/api/latency-results"
debug_upload = true
timeout_s = 10.0

[logging]
level = "INFO"
log_file = "5g-measurement.log"
max_bytes = 5_000_000
backup_count = 3

[system]
running_on_pi = true
network_interfaces = ["wlan0", "wwan0"]
# Both modes open the cellular link and start heartbeating right at boot. "auto" (default) then
# transitions into measuring on its own once the movement gate confirms movement; "manual" does
# nothing further until an explicit remote command (start-measuring-now) says what to do.
mode = "auto"
# An unhandled error reboots. The same error this many times in a row - or this many reboots for
# any errors in a row - reboots into a one-shot recovery state that doesn't measure until told
# to; an error even then reboots into maintenance mode, which keeps only the cellular link up
# (supervised by the link watchdog, radio resets included) for debugging over SSH. A reboot alone
# doesn't leave it: fix the cause, delete crash_state.json next to this file and reboot.
# An error before the run starts (e.g. a broken config file) and an error the crash state can't
# record enter maintenance mode right away, without a reboot and without making it stick: once the
# cause is fixed, the next reboot starts normally. If the config can't be loaded at all, only the
# cellular link comes up, from [quectel_cm] and [link_watchdog] (binary falling back to
# vendor/quectel-CM/quectel-CM).
crash_same_error_limit = 3
crash_reboot_limit = 5

# Restarts quectel-CM when the cellular link (no IPv4 on `interface`) stays down for
# restart_after_s, and after radio_reset_after_restarts restarts that didn't help, resets the
# modem's radio (AT+CFUN). While the link stays down, the wait before each further step doubles,
# up to max_restart_interval_s (never giving up); the next outage starts again from
# restart_after_s. Only active with running_on_pi.
[link_watchdog]
enabled = true
interface = "wwan0"
check_interval_s = 30.0
restart_after_s = 180.0
max_restart_interval_s = 1800.0
radio_reset_after_restarts = 2

# Sets the system clock over NTP (SNTP) once the cellular link is up, because the Pi has no RTC
# and systemd-timesyncd only tries before the link exists. An IPv4 address or hostname; empty
# disables it. Device-specific: set it in config.local.toml.
[clock]
ntp_server = ""
ntp_timeout_s = 3.0
