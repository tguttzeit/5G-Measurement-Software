[project]
name = "5g-measurement-software"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pynmea2>=1.19.0",
    "pyserial>=3.5",
    "serial>=0.0.97",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/measurement_software"]

[tool.pytest.ini_options]
testpaths = ["tests"]
